[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "psychfound"
version = "1.0.0"
description = "Independent training and evaluation pipeline for PsychFound"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ruoxi Wang"}]
dependencies = [
  "PyYAML>=6.0",
  "datasets>=2.16",
  "numpy>=1.24,<3",
]

[project.optional-dependencies]
train = [
  "torch>=2.2",
  "transformers>=4.47,<5",
  "peft>=0.13",
  "trl==0.29.1",
  "accelerate>=1.0",
  "vllm>=0.10.2,<0.13.0; platform_system == 'Linux'",
  "sentencepiece",
  "wandb>=0.18",
]
inference = ["torch>=2.2", "transformers>=4.47,<5", "accelerate>=1.0"]
dev = ["pytest>=8", "ruff>=0.8"]

[project.scripts]
psychfound = "psychfound.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"
